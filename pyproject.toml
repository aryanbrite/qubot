[project]
name = "pqsecure"
version = "0.1.0"
description = "Prototype post-quantum secure channel: ML-KEM-768 + AES-256-GCM"
requires-python = ">=3.9"
dependencies = ["kyber-py>=1.0", "cryptography>=41"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["pqsecure"]
